<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Explorer — India</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #14171f;
    --surface2: #1c202c;
    --surface3: #232837;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8eaf0;
    --text2: #8b90a0;
    --text3: #555b6e;
    --accent: #6c8bef;
    --accent2: #4a67d4;
    --accent-glow: rgba(108,139,239,0.18);
    --green: #3ecf8e;
    --green-bg: rgba(62,207,142,0.1);
    --amber: #f0a04b;
    --amber-bg: rgba(240,160,75,0.1);
    --pink: #e56db1;
    --pink-bg: rgba(229,109,177,0.1);
    --teal: #38bdf8;
    --teal-bg: rgba(56,189,248,0.1);
    --radius: 12px;
    --radius-sm: 7px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  .header {
    padding: 2rem 2.5rem 1.5rem;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    position: sticky;
    top: 0;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(16px);
    z-index: 100;
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    color: var(--text);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-dot {
    width: 9px; height: 9px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .stock-count {
    font-size: 12px;
    color: var(--text3);
    background: var(--surface2);
    border: 0.5px solid var(--border);
    padding: 4px 12px;
    border-radius: 100px;
  }

  .btn-reload {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 100px;
    font-size: 0.8rem;
    color: var(--text2);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .btn-reload:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-reload svg {
    width: 13px; height: 13px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  /* ── SEARCH ── */
  .search-section {
    max-width: 760px;
    margin: 2.5rem auto;
    padding: 0 2rem;
    position: relative;
  }

  .search-label {
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
    display: block;
  }

  .search-wrap {
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    stroke: var(--text3);
    fill: none;
    stroke-width: 2;
    pointer-events: none;
  }

  #search-input {
    width: 100%;
    padding: 0.9rem 1rem 0.9rem 2.75rem;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1.05rem;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  #search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  /* ── DROPDOWN ── */
  .dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    z-index: 200;
    max-height: 360px;
    overflow-y: auto;
    display: none;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  }

  .dropdown.open { display: block; }

  .dropdown::-webkit-scrollbar { width: 4px; }
  .dropdown::-webkit-scrollbar-track { background: transparent; }
  .dropdown::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

  .drop-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0.75rem 1.1rem;
    cursor: pointer;
    transition: background 0.1s;
    border-bottom: 0.5px solid var(--border);
  }

  .drop-item:last-child { border-bottom: none; }
  .drop-item:hover, .drop-item.active { background: var(--surface3); }

  .drop-symbol {
    font-family: 'DM Serif Display', serif;
    font-size: 0.85rem;
    color: var(--accent);
    min-width: 100px;
  }

  .drop-name { font-size: 0.88rem; color: var(--text); flex: 1; }

  .drop-sector {
    font-size: 0.75rem;
    color: var(--text3);
    background: var(--surface3);
    border: 0.5px solid var(--border);
    padding: 2px 8px;
    border-radius: 100px;
    white-space: nowrap;
  }

  .drop-empty {
    padding: 2rem;
    text-align: center;
    color: var(--text3);
    font-size: 0.9rem;
  }

  /* ── STOCK CARD ── */
  .stock-view {
    max-width: 900px;
    margin: 0 auto 4rem;
    padding: 0 2rem;
    animation: fadeUp 0.35s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Hero */
  .stock-hero {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem 2.25rem;
    display: flex;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 1.25rem;
  }

  .symbol-badge {
    min-width: 80px;
    height: 80px;
    background: var(--accent-glow);
    border: 1px solid rgba(108,139,239,0.3);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 1rem;
    color: var(--accent);
    text-align: center;
    padding: 4px;
    line-height: 1.2;
    word-break: break-all;
    flex-shrink: 0;
  }

  .hero-info { flex: 1; }

  .hero-company {
    font-family: 'DM Serif Display', serif;
    font-size: 1.85rem;
    line-height: 1.2;
    margin-bottom: 0.5rem;
  }

  .hero-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 0.75rem;
  }

  .tag {
    font-size: 0.76rem;
    padding: 3px 11px;
    border-radius: 100px;
    border: 0.5px solid;
    font-weight: 500;
  }

  .tag-industry { background: var(--teal-bg); border-color: rgba(56,189,248,0.25); color: var(--teal); }
  .tag-sector { background: var(--green-bg); border-color: rgba(62,207,142,0.25); color: var(--green); }
  .tag-subsector { background: var(--amber-bg); border-color: rgba(240,160,75,0.25); color: var(--amber); }

  /* Grid */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
  }

  .info-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 1.75rem;
  }

  .info-card-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .info-card-label .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .dot-accent { background: var(--accent); }
  .dot-green { background: var(--green); }

  .info-card-body {
    font-size: 0.97rem;
    color: var(--text);
    line-height: 1.65;
  }

  /* Example box */
  .example-box {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: var(--radius);
    padding: 1.4rem 1.75rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
    margin-bottom: 1.25rem;
  }

  .example-icon {
    width: 36px; height: 36px; flex-shrink: 0;
    background: var(--green-bg);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .example-icon svg { width: 18px; height: 18px; stroke: var(--green); fill: none; stroke-width: 1.8; }

  .example-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 0.4rem;
  }

  .example-body {
    font-size: 0.97rem;
    color: var(--text);
    line-height: 1.65;
  }

  /* Meta row */
  .meta-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
  }

  .meta-card {
    background: var(--surface2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 1rem 1.25rem;
  }

  .meta-card-label {
    font-size: 0.72rem;
    color: var(--text3);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .meta-card-value {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
  }

  /* Browse panel */
  .browse-section {
    max-width: 900px;
    margin: 0 auto 4rem;
    padding: 0 2rem;
  }

  .browse-heading {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 1rem;
  }

  .industry-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .filter-btn {
    padding: 5px 14px;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 100px;
    font-size: 0.8rem;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'DM Sans', sans-serif;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

  .browse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }

  .browse-card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.9rem 1rem;
    cursor: pointer;
    transition: all 0.15s;
  }

  .browse-card:hover {
    border-color: var(--border2);
    background: var(--surface2);
    transform: translateY(-1px);
  }

  .browse-sym {
    font-family: 'DM Serif Display', serif;
    font-size: 0.88rem;
    color: var(--accent);
    margin-bottom: 3px;
  }

  .browse-name {
    font-size: 0.78rem;
    color: var(--text2);
    line-height: 1.35;
  }

  @media (max-width: 600px) {
    .info-grid { grid-template-columns: 1fr; }
    .meta-row { grid-template-columns: 1fr 1fr; }
    .stock-hero { flex-direction: column; }
    .header { padding: 1.25rem 1.25rem; }
    .search-section, .stock-view, .browse-section { padding: 0 1.25rem; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">
    <span class="logo-dot"></span>
    Stock Explorer
  </div>
  <div class="header-right">
    <span class="stock-count" id="stock-count">Loading…</span>
    <button class="btn-reload" onclick="location.reload()">
      <svg viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      Reload
    </button>
  </div>
</header>

<!-- Main App -->
<div id="app">

  <!-- Search -->
  <div class="search-section">
    <span class="search-label">Search stock</span>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Enter company name or symbol…" autocomplete="off">
      <div class="dropdown" id="dropdown"></div>
    </div>
  </div>

  <!-- Stock Detail View -->
  <div id="stock-view" class="stock-view" style="display:none;"></div>

  <!-- Browse Section -->
  <div class="browse-section" id="browse-section">
    <p class="browse-heading">Browse by industry</p>
    <div class="industry-filter" id="industry-filter"></div>
    <div class="browse-grid" id="browse-grid"></div>
  </div>

</div>

let stocks = STOCKS_DATA;
let activeFilter = 'All';

const searchInput = document.getElementById('search-input');
const dropdown = document.getElementById('dropdown');
const stockView = document.getElementById('stock-view');
const browseSection = document.getElementById('browse-section');
const stockCount = document.getElementById('stock-count');

// ── INIT ──
stockCount.textContent = `${stocks.length} stocks`;
buildBrowse();

// ── SEARCH ──
let activeIdx = -1;
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  activeIdx = -1;
  if (!q) { dropdown.innerHTML = ''; dropdown.classList.remove('open'); return; }

  const results = stocks.filter(s =>
    s.symbol.toLowerCase().includes(q) || s.company.toLowerCase().includes(q)
  ).slice(0, 14);

  if (!results.length) {
    dropdown.innerHTML = '<div class="drop-empty">No matching stocks found</div>';
    dropdown.classList.add('open');
    return;
  }

  dropdown.innerHTML = results.map((s, i) => `
    <div class="drop-item" data-i="${i}" onclick="selectStock('${esc(s.symbol)}')">
      <span class="drop-symbol">${s.symbol}</span>
      <span class="drop-name">${s.company}</span>
      <span class="drop-sector">${s.subsector || s.sector}</span>
    </div>
  `).join('');
  dropdown.classList.add('open');
  dropdown._results = results;
});

searchInput.addEventListener('keydown', e => {
  const items = dropdown.querySelectorAll('.drop-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx+1, items.length-1); highlight(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); highlight(items); }
  else if (e.key === 'Enter' && activeIdx >= 0) { items[activeIdx].click(); }
  else if (e.key === 'Escape') { dropdown.classList.remove('open'); }
});

function highlight(items) {
  items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
  if (activeIdx >= 0) items[activeIdx].scrollIntoView({ block: 'nearest' });
}

document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) dropdown.classList.remove('open');
});

function esc(s) { return s.replace(/'/g, "\\'"); }

function selectStock(sym) {
  const stock = stocks.find(s => s.symbol === sym);
  if (!stock) return;
  dropdown.classList.remove('open');
  searchInput.value = stock.company || stock.symbol;
  renderStock(stock);
}

// ── RENDER STOCK ──
function renderStock(s) {
  stockView.style.display = 'block';
  browseSection.style.display = 'none';

  const initials = (s.symbol || s.company || '?').slice(0, 4);

  stockView.innerHTML = `
    <div class="stock-hero">
      <div class="symbol-badge">${initials}</div>
      <div class="hero-info">
        <div class="hero-company">${s.company || s.symbol}</div>
        <div style="font-size:0.85rem; color:var(--text2); font-family:'DM Serif Display',serif; font-style:italic;">${s.symbol}</div>
        <div class="hero-tags">
          ${s.industry ? `<span class="tag tag-industry">${s.industry}</span>` : ''}
          ${s.sector ? `<span class="tag tag-sector">${s.sector}</span>` : ''}
          ${s.subsector ? `<span class="tag tag-subsector">${s.subsector}</span>` : ''}
        </div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-card">
        <div class="info-card-label">

      </div>
      <div class="info-card">

          Sector snapshot
        </div>
        <div class="info-card-body">
          <div style="margin-bottom:8px;">
            <span style="font-size:0.74rem; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em;">Industry</span><br>
            <span style="font-weight:500;">${s.industry || '—'}</span>
          </div>
          <div style="margin-bottom:8px;">
            <span style="font-size:0.74rem; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em;">Primary Sector</span><br>
            <span style="font-weight:500;">${s.sector || '—'}</span>
          </div>
          <div>
            <span style="font-size:0.74rem; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em;">Sub-Sector</span><br>
            <span style="font-weight:500;">${s.subsector || '—'}</span>
          </div>
        </div>
      </div>
    </div>

    ${s.example ? `
    <div class="example-box">
      <div class="example-icon">
        <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div>
        <div class="example-label">Real-world example</div>
        <div class="example-body">${s.example}</div>
      </div>
    </div>` : ''}

    <div class="meta-row">
      <div class="meta-card">
        <div class="meta-card-label">Symbol</div>
        <div class="meta-card-value" style="color:var(--accent); font-family:'DM Serif Display',serif;">${s.symbol}</div>
      </div>
      <div class="meta-card">
        <div class="meta-card-label">Exchange</div>
        <div class="meta-card-value">NSE / BSE</div>
      </div>
      <div class="meta-card">
        <div class="meta-card-label">Market</div>
        <div class="meta-card-value">India</div>
      </div>
    </div>

    <div style="margin-top:1.5rem; display:flex; gap:10px;">
      <button onclick="backToBrowse()" style="background:var(--surface2); border:0.5px solid var(--border2); border-radius:var(--radius-sm); padding:0.6rem 1.25rem; color:var(--text2); font-size:0.87rem; cursor:pointer; font-family:'DM Sans',sans-serif; display:flex; align-items:center; gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to browse
      </button>
    </div>
  `;
  stockView.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function backToBrowse() {
  stockView.style.display = 'none';
  browseSection.style.display = 'block';
  searchInput.value = '';
}

// ── BROWSE ──
function buildBrowse() {
  const industries = ['All', ...new Set(stocks.map(s => s.industry).filter(Boolean))].sort();

  const filterEl = document.getElementById('industry-filter');
  filterEl.innerHTML = industries.map(ind => `
    <button class="filter-btn ${ind==='All'?'active':''}" onclick="setFilter('${esc(ind)}')">${ind}</button>
  `).join('');

  renderBrowseGrid('All');
}

function setFilter(ind) {
  activeFilter = ind;
  document.querySelectorAll('.filter-btn').forEach(btn =>
    btn.classList.toggle('active', btn.textContent === ind));
  renderBrowseGrid(ind);
}

function renderBrowseGrid(ind) {
  const filtered = ind === 'All' ? stocks : stocks.filter(s => s.industry === ind);
  const grid = document.getElementById('browse-grid');
  grid.innerHTML = filtered.slice(0, 200).map(s => `
    <div class="browse-card" onclick="selectStock('${esc(s.symbol)}')">
      <div class="browse-sym">${s.symbol}</div>
      <div class="browse-name">${s.company}</div>
    </div>
  `).join('');
}
</script>
</body>
</html>
